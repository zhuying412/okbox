version: "3.9"

# ─── 开发环境 Docker Compose 配置 ─────────────────────────────────────
# 所有服务通过 Docker Compose 管理，后端和前端挂载代码目录实现热重载
# 仅 Nginx 端口对外暴露，其他服务仅在 Docker 内部网络通信
# 启动命令：./scripts/dev-start.sh 或 docker compose up

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: okbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-okbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okbox}
      POSTGRES_DB: ${POSTGRES_DB:-okbox}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okbox}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: okbox-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (对象存储) ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: okbox-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 后端 API（开发模式，热重载）──────────────────────────────
  backend:
    build:
      context: ../packages/backend
      dockerfile: Dockerfile
    container_name: okbox-backend
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "okbox.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: development
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-debug}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-okbox}:${POSTGRES_PASSWORD:-okbox}@postgres:5432/${POSTGRES_DB:-okbox}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-okbox}
      MINIO_USE_SSL: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-not-for-production}
    expose:
      - "8000"
    volumes:
      # 挂载源代码实现热重载
      - ../packages/backend/src:/app/src:ro
      - ../packages/backend/alembic:/app/alembic:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── 前端（开发模式，Vite HMR 热重载）────────────────────────
  frontend:
    image: node:22-alpine
    container_name: okbox-frontend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"]
    expose:
      - "3000"
    volumes:
      # 挂载源代码实现热重载
      - ../packages/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  # ─── Nginx 反向代理（唯一对外暴露端口）───────────────────────
  nginx:
    image: nginx:alpine
    container_name: okbox-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:

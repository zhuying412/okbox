# PostgreSQL WAL archiving configuration
# Add to postgresql.conf for continuous archiving

# Enable WAL archiving
wal_level = replica
archive_mode = on
archive_command = 'cp %p /data/wal_archive/%f'
archive_timeout = 300  # Archive every 5 minutes at minimum

# Keep enough WAL for point-in-time recovery
max_wal_senders = 3
wal_keep_size = '1GB'

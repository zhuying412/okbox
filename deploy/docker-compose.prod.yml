version: "3.9"

# ─── 生产环境 Docker Compose 配置 ─────────────────────────────────────
# HTTP 模式（无 HTTPS），所有服务使用生产镜像
# 启动命令：./scripts/prod-start.sh 或 docker compose -f docker-compose.prod.yml up -d

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: okbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-okbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-okbox}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okbox}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: okbox-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (对象存储) ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: okbox-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 后端 API（生产模式）─────────────────────────────────────
  backend:
    build:
      context: ../packages/backend
      dockerfile: Dockerfile
    container_name: okbox-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-okbox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-okbox}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-okbox}
      MINIO_USE_SSL: "false"
      SECRET_KEY: ${SECRET_KEY}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── 前端（生产构建）─────────────────────────────────────────
  frontend:
    build:
      context: ../packages/frontend
      dockerfile: Dockerfile
    container_name: okbox-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  # ─── Nginx 反向代理（HTTP）──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: okbox-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
